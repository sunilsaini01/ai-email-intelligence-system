[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: ruff's bugbear rule flags `Depends(...)` in argument defaults as a
# generic anti-pattern (mutable-default-style footgun). It's a false positive
# for FastAPI specifically — Depends() is FastAPI's documented DI mechanism;
# the framework calls it per-request, not once at import time. This is the
# standard, accepted ignore for any FastAPI codebase using ruff.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
