# Template only -- placeholders, not real secrets. Do NOT apply this file
# directly and do NOT commit a filled-in copy.
#
# Usage:
#   cp k8s/secrets.example.yaml k8s/secrets.yaml   # k8s/secrets.yaml is gitignored
#   edit k8s/secrets.yaml with real values
#   kubectl apply -f k8s/secrets.yaml
#
# stringData (not data) is used so values are plain text in this file --
# Kubernetes base64-encodes them into the Secret object itself on apply.
# That is obfuscation, not encryption: anyone with `get secret -o yaml` RBAC
# access can read these back in plain text. Real secret-at-rest encryption
# needs a KMS/Vault-backed provider, which is out of scope for this local
# validation phase (see docs/architecture_kubernetes.md, "Security Review").
apiVersion: v1
kind: Secret
metadata:
  name: email-ai-secrets
  namespace: email-ai
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  # Optional -- only needed if auto-reply's Groq provider is exercised.
  # Leave empty to match the application default (feature no-ops without it).
  GROQ_API_KEY: ""
