apiVersion: 1

datasources:
  # uid pinned explicitly -- found by this phase's own real-verification
  # step: without it, Grafana auto-generates a random uid on provision,
  # which does NOT match the fixed "Prometheus" uid every panel in
  # email_intelligence_system_health.json references, silently breaking
  # every panel's datasource resolution. Confirmed via direct
  # reproduction (docker exec + `GET /api/datasources` showed
  # "PBFA97CFB590B2093", not "Prometheus").
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
