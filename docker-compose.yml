# Local development stack: API + Postgres.
#
# Why depends_on with a healthcheck condition, not just depends_on:
#   Plain `depends_on` only waits for the container to START, not for Postgres
#   to be ready to accept connections — a classic source of "works on second
#   run only" bugs. The healthcheck below makes the API wait for an actual
#   successful `pg_isready` before starting.

services:
  postgres:
    image: postgres:15-alpine
    container_name: email_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-email_intelligence}
    # If you have a native (non-Docker) Postgres already installed and
    # running on this machine, it is very likely ALSO listening on host
    # port 5432 — and on Windows in particular, both can end up bound
    # simultaneously without Docker raising a "port already allocated"
    # error, so `docker compose up` appears to succeed. When that happens,
    # connections to localhost:5432 can silently land on the NATIVE
    # Postgres instead of this container — you'll see confusing
    # "password authentication failed" errors using these exact
    # POSTGRES_USER/POSTGRES_PASSWORD values, because they're valid for
    # THIS container, not your native install. (Discovered the hard way
    # verifying the Phase 4 Alembic migrations — see
    # docs/architecture_priority_classification.md "Performance".)
    # If you hit this: change the mapping below to e.g. "5433:5432" and set
    # POSTGRES_PORT=5433 in backend/.env to match.
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile
    container_name: email_ai_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres   # service name on the compose network, not localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app   # live-reload mount for local dev only

volumes:
  postgres_data:
