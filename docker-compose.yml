# Local development stack: API + Postgres + Kafka + Multi-Agent workers.
#
# Port architecture:
#   E-commerce RAG:
#       host 8000 -> container 8000
#
#   Email Intelligence API:
#       host 8001 -> container 8000
#
#   Email Intelligence PostgreSQL:
#       host 5433 -> container 5432
#
# IMPORTANT:
#   Host-side PostgreSQL access uses localhost:5433.
#   Containers communicate with PostgreSQL using postgres:5432.
#
#   Therefore:
#       POSTGRES_PORT=5432 inside Docker
#       localhost:5433 from Windows host

services:

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: email_ai_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-email_intelligence}

    # Host port 5433 -> container port 5432.
    #
    # This prevents collision with:
    #   - native PostgreSQL on Windows
    #   - other projects using localhost:5432
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-email_intelligence}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # Kafka
  kafka:
    image: apache/kafka:3.9.0
    container_name: email_ai_kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Internal Docker listener:
      #   kafka:29092
      #curl.exe -v http://127.0.0.1:8001/api/v1/health
      # Host listener:
      #   localhost:9092

      KAFKA_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        CONTROLLER://kafka:29093,
        PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    volumes:
      - kafka_data:/var/lib/kafka/data


  # FastAPI
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile

    container_name: email_ai_api
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      # Docker-internal PostgreSQL configuration
      #
      # DO NOT use 5433 here.
      #
      # 5433 is the Windows HOST port.
      # PostgreSQL itself listens on 5432 inside the container.
      #
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      # Database credentials/database name are inherited from backend/.env.
      # Explicit defaults are provided so Compose remains predictable.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-email_intelligence}

      # Docker-internal Kafka address.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    # Email Intelligence API:
    #
    # Windows:
    #   http://localhost:8001
    #
    # Container:
    #   http://0.0.0.0:8000
    ports:
      - "8001:8000"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    volumes:
      # Live source-code mount for local development.
      - ./backend/app:/app/app

      # ML artifacts used by Spam/Priority/Category/Intent services.
      - ./artifacts:/artifacts


  # Multi-Agent worker
  agents:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile

    container_name: email_ai_agents
    restart: unless-stopped

    command:
      - python
      - -m
      - app.agents.runner

    env_file:
      - ./backend/.env

    environment:
      # Same Docker-internal PostgreSQL configuration as API.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-email_intelligence}

      # Docker-internal Kafka address.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    volumes:
      # Live source-code mount for local development.
      - ./backend/app:/app/app

      # Same ML artifacts available to agents.
      - ./artifacts:/artifacts

    # The agents container runs a Kafka consumer process,
    # NOT an HTTP server.
    #
    # Therefore the Dockerfile HTTP healthcheck does not apply here.
    healthcheck:
      disable: true


# Persistent Docker volumes
volumes:
  postgres_data:
  kafka_data: