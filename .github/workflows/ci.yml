name: CI

# FR-70: lint, unit tests, integration tests, and model sanity checks
# before every deployment. No deploy stage exists yet -- that is out of
# scope for Phase 13 (see docs/architecture_ci_cd.md). Every job below is
# a real quality gate: a failing job fails the run, nothing here is
# decorative.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11" # matches docker/Dockerfile and backend/pyproject.toml's declared target -- NOT this repo's own dev-machine interpreter (3.13), which is not what actually ships.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff -- hard gate (imports, unused imports, modernization, bugbear)
        # B905 (zip without explicit strict=) is excluded here on purpose,
        # not an oversight: it needs a real True/False decision per call
        # site, which isn't safe to make via blind autofix -- see the
        # report-only step below and docs/architecture_ci_cd.md.
        run: ruff check backend/app --select E9,F,I,UP,B --ignore B008,B905
      - name: Ruff -- line length + zip-strict (report only, not a hard gate yet)
        if: always()
        run: ruff check backend/app --select E501,B905 || echo "::warning::E501/B905 violations exist (163 + 2 pre-existing as of Phase 13, tracked separately -- not blocking this build)"

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Download NLTK stopwords corpus
        # app/preprocessing/text_helpers.py and email_preprocessor.py load
        # nltk.corpus.stopwords at MODULE IMPORT time -- the corpus is data,
        # not part of the nltk package, and must be fetched separately
        # before these modules (and anything importing them) can even load.
        run: python -m nltk.downloader stopwords
      - name: Run test suite with coverage
        working-directory: backend
        run: python -m pytest tests/ -q --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
      - name: Revert test-run artifact pollution
        if: always()
        # This suite writes real feedback rows into a committed fixture
        # file as a side effect of running (a pre-existing, disclosed
        # behavior of this test suite, not a CI bug) -- irrelevant on a
        # throwaway CI runner, but kept for symmetry with the documented
        # local-dev convention (docs/architecture_ci_cd.md).
        run: git checkout -- artifacts/spam_feedback.jsonl || true

  postgres-integration:
    name: PostgreSQL migration + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: email_intelligence
      SECRET_KEY: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Alembic upgrade -> downgrade -> upgrade round-trip against real Postgres
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  kafka-integration:
    name: Kafka + Postgres multi-agent integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: email_intelligence
      SECRET_KEY: ci-test-secret-not-for-production
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      RUN_KAFKA_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Download NLTK stopwords corpus
        run: python -m nltk.downloader stopwords
      - name: Migrate database
        working-directory: backend
        run: alembic upgrade head
      - name: Real Kafka + Postgres multi-agent pipeline test
        working-directory: backend
        run: python -m pytest tests/test_phase12_kafka_integration.py -v
      - name: Revert test-run artifact pollution
        if: always()
        run: git checkout -- artifacts/spam_feedback.jsonl || true

  model-sanity:
    name: Model sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Download NLTK stopwords corpus
        # Same reason as the unit-tests/kafka-integration jobs: the spam/
        # priority/category/sentiment/intent services all transitively
        # import app/preprocessing/text_helpers.py, which loads this
        # corpus at module level.
        run: python -m nltk.downloader stopwords
      - name: Run model sanity checks
        # Answers "does every served artifact still load and produce a
        # structurally valid prediction" -- NOT "is the model accurate."
        # See backend/scripts/ci/model_sanity_check.py's own docstring.
        working-directory: backend
        run: python -m scripts.ci.model_sanity_check

  model-registry-metadata:
    name: Model registry metadata validation (Phase 15A / FR-71)
    runs-on: ubuntu-latest
    # Deliberately does NOT connect to a live MLflow server -- see
    # backend/scripts/mlops/validate_registry_metadata.py's own docstring.
    # Static checks only: every registrable module's metrics.json is
    # well-formed, and if a `provenance` block exists, its evidence_status
    # matches this project's own disclosed status (app/mlops/model_metadata.py
    # MODULE_EVIDENCE_STATUS) -- catches a promoted model silently claiming
    # stronger evidence than what's actually disclosed. Does not require
    # requirements-mlops.txt (no mlflow import anywhere in this check).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate model registry metadata
        working-directory: backend
        run: python -m scripts.mlops.validate_registry_metadata

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -f docker/Dockerfile -t email-ai-api:ci ./backend

  k8s-validate:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    # What this validates: every manifest under k8s/ is well-formed and
    # accepted by a real Kubernetes API server (server-side dry-run --
    # catches invalid fields, bad API versions, schema violations that a
    # pure YAML lint would miss). What this does NOT validate: that Pods
    # actually start, that images pull, that probes pass, that scaling or
    # failure behavior works -- that requires a real running cluster with
    # the real application image (~3GB with baked-in model artifacts),
    # which is deliberately not built or pushed here. That evidence comes
    # from a real local kind run instead -- see
    # docs/evidence/kubernetes_failure_analysis.md and
    # docs/architecture/kubernetes_runbook.md. This job would not have
    # caught the Kafka publishNotReadyAddresses bug found during that real
    # deploy (it's a runtime networking behavior, not a schema error) --
    # stated here explicitly so this job's coverage isn't overclaimed.
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-validate
      - name: Server-side dry-run apply of every manifest
        run: |
          kubectl apply --dry-run=server -f k8s/namespace.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/configmap.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/secrets.example.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/postgres/statefulset.yaml -f k8s/postgres/service.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/kafka/statefulset.yaml -f k8s/kafka/service.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/artifacts-chroma-pvc.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/api-deployment.yaml -f k8s/api-service.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/agents-deployment.yaml
          kubectl apply --dry-run=server -n email-ai -f k8s/migration-job.yaml
      - name: kustomize build sanity check
        run: kubectl kustomize k8s/ > /dev/null

  secret-scan:
    name: Secret safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: Quality gate (all checks)
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - postgres-integration
      - kafka-integration
      - model-sanity
      - model-registry-metadata
      - docker-build
      - k8s-validate
      - secret-scan
    steps:
      - run: echo "All Phase 13 quality gates passed."
