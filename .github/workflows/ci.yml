name: CI

# FR-70: lint, unit tests, integration tests, and model sanity checks
# before every deployment. No deploy stage exists yet -- that is out of
# scope for Phase 13 (see docs/architecture_ci_cd.md). Every job below is
# a real quality gate: a failing job fails the run, nothing here is
# decorative.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11" # matches docker/Dockerfile and backend/pyproject.toml's declared target -- NOT this repo's own dev-machine interpreter (3.13), which is not what actually ships.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff -- hard gate (imports, unused imports, modernization, bugbear)
        # B905 (zip without explicit strict=) is excluded here on purpose,
        # not an oversight: it needs a real True/False decision per call
        # site, which isn't safe to make via blind autofix -- see the
        # report-only step below and docs/architecture_ci_cd.md.
        run: ruff check backend/app --select E9,F,I,UP,B --ignore B008,B905
      - name: Ruff -- line length + zip-strict (report only, not a hard gate yet)
        if: always()
        run: ruff check backend/app --select E501,B905 || echo "::warning::E501/B905 violations exist (163 + 2 pre-existing as of Phase 13, tracked separately -- not blocking this build)"

  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Download NLTK stopwords corpus
        # app/preprocessing/text_helpers.py and email_preprocessor.py load
        # nltk.corpus.stopwords at MODULE IMPORT time -- the corpus is data,
        # not part of the nltk package, and must be fetched separately
        # before these modules (and anything importing them) can even load.
        run: python -m nltk.downloader stopwords
      - name: Run test suite with coverage
        working-directory: backend
        run: python -m pytest tests/ -q --cov=app --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
      - name: Revert test-run artifact pollution
        if: always()
        # This suite writes real feedback rows into a committed fixture
        # file as a side effect of running (a pre-existing, disclosed
        # behavior of this test suite, not a CI bug) -- irrelevant on a
        # throwaway CI runner, but kept for symmetry with the documented
        # local-dev convention (docs/architecture_ci_cd.md).
        run: git checkout -- artifacts/spam_feedback.jsonl || true

  postgres-integration:
    name: PostgreSQL migration + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: email_intelligence
      SECRET_KEY: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Alembic upgrade -> downgrade -> upgrade round-trip against real Postgres
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  kafka-integration:
    name: Kafka + Postgres multi-agent integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: apache/kafka:3.9.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: email_intelligence
      SECRET_KEY: ci-test-secret-not-for-production
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      RUN_KAFKA_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Download NLTK stopwords corpus
        run: python -m nltk.downloader stopwords
      - name: Migrate database
        working-directory: backend
        run: alembic upgrade head
      - name: Real Kafka + Postgres multi-agent pipeline test
        working-directory: backend
        run: python -m pytest tests/test_phase12_kafka_integration.py -v
      - name: Revert test-run artifact pollution
        if: always()
        run: git checkout -- artifacts/spam_feedback.jsonl || true

  model-sanity:
    name: Model sanity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Download NLTK stopwords corpus
        # Same reason as the unit-tests/kafka-integration jobs: the spam/
        # priority/category/sentiment/intent services all transitively
        # import app/preprocessing/text_helpers.py, which loads this
        # corpus at module level.
        run: python -m nltk.downloader stopwords
      - name: Run model sanity checks
        # Answers "does every served artifact still load and produce a
        # structurally valid prediction" -- NOT "is the model accurate."
        # See backend/scripts/ci/model_sanity_check.py's own docstring.
        working-directory: backend
        run: python -m scripts.ci.model_sanity_check

  model-registry-metadata:
    name: Model registry metadata validation (Phase 15A / FR-71)
    runs-on: ubuntu-latest
    # Deliberately does NOT connect to a live MLflow server -- see
    # backend/scripts/mlops/validate_registry_metadata.py's own docstring.
    # Static checks only: every registrable module's metrics.json is
    # well-formed, and if a `provenance` block exists, its evidence_status
    # matches this project's own disclosed status (app/mlops/model_metadata.py
    # MODULE_EVIDENCE_STATUS) -- catches a promoted model silently claiming
    # stronger evidence than what's actually disclosed. Does not require
    # requirements-mlops.txt (no mlflow import anywhere in this check).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate model registry metadata
        working-directory: backend
        run: python -m scripts.mlops.validate_registry_metadata

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -f docker/Dockerfile -t email-ai-api:ci ./backend

  k8s-validate:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    # Phase 15B fix -- root cause of the prior failure:
    # `kubectl apply --dry-run=server -f k8s/namespace.yaml` validates the
    # Namespace against the API server but --dry-run=server never writes to
    # etcd, so it never actually exists in the cluster. The next line
    # (dry-running a namespaced resource against it) then failed with
    # "namespaces \"email-ai\" not found" -- reproduced exactly as reported.
    #
    # Fixed by actually creating the namespace first (no dry-run), then
    # both validating AND deploying the real stack against it. This job now
    # proves the manifests are schema-valid (server-side dry-run of the
    # complete kustomize-composed resource set) AND that the described
    # deployment actually comes up: real Postgres/Kafka, a real migration
    # run, real api/agents Pods, and a real end-to-end request through
    # Kubernetes -> API -> Orchestrator -> Kafka -> Agents -> PostgreSQL --
    # not just that individual files parse. This automates the exact,
    # already hand-verified process in docs/architecture/kubernetes_runbook.md.
    #
    # MLflow (k8s/mlflow/*) is included in the dry-run validation below
    # (it's part of k8s/kustomization.yaml) but deliberately NOT built or
    # deployed live in this job -- its own image is unrelated to this fix
    # and doubling image-build cost here isn't justified by the namespace
    # bug this job exists to catch.
    steps:
      - uses: actions/checkout@v4

      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-validate

      - name: Create the email-ai namespace (real apply, not dry-run)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl get namespace email-ai

      - name: kustomize build sanity check
        # Runs before server-side validation on purpose: rendering is the
        # cheapest possible check and should fail first if broken, instead
        # of running last and silently never executing when an earlier step
        # fails (the exact way it went unexecuted before this fix).
        run: kubectl kustomize k8s/ > /dev/null

      - name: Server-side dry-run of the complete manifest set
        # Validates every resource kustomize composes together in one pass,
        # now that the namespace genuinely exists -- catches schema errors
        # and unresolvable references (ConfigMap/Secret keys, Service
        # names) across the full set, rather than dry-running individual
        # files in an arbitrary order.
        run: kubectl apply --dry-run=server -k k8s/

      - name: Build application image (base)
        # Same commands docs/architecture/kubernetes_runbook.md already
        # documents and hand-verifies. Plain `docker build`, not buildx --
        # docker/Dockerfile.k8s's FROM email-ai-api:base needs to resolve
        # against the local daemon's image store, which buildx's isolated
        # builder does not share by default.
        run: docker build -f docker/Dockerfile -t email-ai-api:base ./backend

      - name: Build application image (Kubernetes layer -- bakes in artifacts/)
        run: docker build -f docker/Dockerfile.k8s -t email-ai-api:k8s .

      - name: Load image into kind (no registry backs a kind cluster)
        run: kind load docker-image email-ai-api:k8s --name ci-validate

      - name: Deploy config and secrets
        # k8s/secrets.example.yaml applied as-is -- placeholder values only,
        # this cluster is destroyed at the end of the job and never reachable
        # outside it (same template this job's own dry-run already used).
        run: |
          kubectl apply -n email-ai -f k8s/configmap.yaml
          kubectl apply -n email-ai -f k8s/secrets.example.yaml

      - name: Deploy stateful infrastructure (Postgres, Kafka, Chroma PVC)
        run: |
          kubectl apply -n email-ai -f k8s/postgres/statefulset.yaml -f k8s/postgres/service.yaml
          kubectl apply -n email-ai -f k8s/kafka/statefulset.yaml -f k8s/kafka/service.yaml
          kubectl apply -n email-ai -f k8s/artifacts-chroma-pvc.yaml
          kubectl wait --for=condition=ready pod -l app=postgres -n email-ai --timeout=180s
          kubectl wait --for=condition=ready pod -l app=kafka -n email-ai --timeout=180s

      - name: Run database migrations
        run: |
          kubectl apply -n email-ai -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/db-migrate -n email-ai --timeout=180s

      - name: Deploy api and agents
        # api scaled to 1 replica for this job on purpose -- horizontal
        # scaling already has real, dedicated evidence from Phase 14's local
        # kind testing (docs/evidence/requirements_traceability_kubernetes.md);
        # this job verifies the deployment pipeline itself on a
        # resource-constrained shared CI runner, not scaling behavior.
        run: |
          kubectl apply -n email-ai -f k8s/api-deployment.yaml -f k8s/api-service.yaml
          kubectl apply -n email-ai -f k8s/agents-deployment.yaml
          kubectl scale deployment api -n email-ai --replicas=1
          kubectl wait --for=condition=ready pod -l app=api -n email-ai --timeout=240s
          kubectl wait --for=condition=ready pod -l app=agents -n email-ai --timeout=120s

      - name: Verify health, readiness, and a real end-to-end request
        # Reuses the exact in-cluster-client smoke-test mechanism
        # docs/architecture/kubernetes_runbook.md already documents (not
        # port-forward -- see that file's own note on why). Health/readiness
        # prove the api Pod is genuinely serving with a live Postgres
        # connection. POST /email/process + polling GET /workflows/{id}
        # proves the full Kubernetes -> API -> Orchestrator -> Kafka ->
        # Agents -> PostgreSQL chain using existing endpoints only -- no new
        # application code.
        run: |
          kubectl run curl-client -n email-ai --image=curlimages/curl:8.10.1 --restart=Never -- sleep 300
          kubectl wait --for=condition=ready pod/curl-client -n email-ai --timeout=60s

          echo "--- liveness ---"
          kubectl exec -n email-ai curl-client -- curl -sf http://api:8000/api/v1/health

          echo "--- readiness (requires a live Postgres connection) ---"
          kubectl exec -n email-ai curl-client -- curl -sf http://api:8000/api/v1/health/ready

          echo "--- end-to-end: dispatch through Kafka/agents, poll to completion ---"
          RESPONSE=$(kubectl exec -n email-ai curl-client -- curl -sf -X POST http://api:8000/api/v1/email/process \
            -H "Content-Type: application/json" \
            -d '{"subject":"CI smoke test","body":"This is an automated Kubernetes deployment smoke test."}')
          echo "$RESPONSE"
          JOB_ID=$(echo "$RESPONSE" | jq -r .job_id)
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "::error::No job_id returned from POST /email/process"
            exit 1
          fi

          STATUS="PENDING"
          for i in $(seq 1 30); do
            STATUS=$(kubectl exec -n email-ai curl-client -- curl -sf "http://api:8000/api/v1/workflows/$JOB_ID" | jq -r .status)
            echo "workflow $JOB_ID status: $STATUS (attempt $i)"
            case "$STATUS" in
              COMPLETED|PARTIAL) break ;;
              FAILED) echo "::error::Workflow $JOB_ID failed"; exit 1 ;;
            esac
            sleep 3
          done
          if [ "$STATUS" != "COMPLETED" ] && [ "$STATUS" != "PARTIAL" ]; then
            echo "::error::Workflow $JOB_ID did not reach a terminal status within timeout (last status: $STATUS)"
            exit 1
          fi

          kubectl delete pod curl-client -n email-ai --wait=false

      - name: Collect diagnostics on failure
        if: failure()
        # `kubectl get -A` output never includes Secret VALUES (only
        # metadata/names) -- logs are pulled from the app's own stdout only,
        # which does not log Settings/env vars at startup (verified: no
        # such logging call exists in app/main.py).
        run: |
          echo "--- pods ---"
          kubectl get pods -A -o wide
          echo "--- deployments ---"
          kubectl get deployments -A
          echo "--- statefulsets ---"
          kubectl get statefulsets -A
          echo "--- services ---"
          kubectl get services -A
          echo "--- events ---"
          kubectl get events -A --sort-by=.lastTimestamp
          echo "--- api logs ---"
          kubectl logs -n email-ai deploy/api --tail=200 || true
          echo "--- agents logs ---"
          kubectl logs -n email-ai deploy/agents --tail=200 || true
          echo "--- migration job logs ---"
          kubectl logs -n email-ai job/db-migrate --tail=200 || true

      - name: Delete ephemeral kind cluster
        if: always()
        run: kind delete cluster --name ci-validate

  secret-scan:
    name: Secret safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: Quality gate (all checks)
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - postgres-integration
      - kafka-integration
      - model-sanity
      - model-registry-metadata
      - docker-build
      - k8s-validate
      - secret-scan
    steps:
      - run: echo "All Phase 13 quality gates passed."
